{% extends "base.html" %}
{% block title %}로그인 — IssueLens{% endblock %}
{% block content %}
<div class="auth-box card">
  <h2>다시 만나서 반가워요</h2>
  <form method="post" class="form">
    <label class="field">이메일
      <input type="email" name="email" required placeholder="you@example.com">
    </label>
    <label class="field">비밀번호
      <input type="password" name="password" required>
    </label>
    <label class="remember-row">
      <input type="checkbox" name="remember" checked>
      <span>로그인 상태 유지 <span class="muted">(30일)</span></span>
    </label>
    <button class="btn btn-primary btn-block" type="submit">로그인</button>
  </form>
  <div class="divider"><span>또는 소셜 계정으로</span></div>
  <div class="social-row">
    <a class="btn social google {{ '' if providers['google'] else 'disabled' }}"
       href="{{ url_for('auth.social_start', provider='google') }}">Google로 계속하기</a>
    <a class="btn social kakao {{ '' if providers['kakao'] else 'disabled' }}"
       href="{{ url_for('auth.social_start', provider='kakao') }}">카카오로 계속하기</a>
    <a class="btn social naver {{ '' if providers['naver'] else 'disabled' }}"
       href="{{ url_for('auth.social_start', provider='naver') }}">네이버로 계속하기</a>
  </div>
  <p class="muted">계정이 없으신가요? <a href="{{ url_for('auth.register') }}">회원가입</a></p>
  <p class="muted small">데모 계정: demo@example.com / demo1234</p>
</div>
{% endblock %}
