# Render Blueprint — https://render.com/docs/blueprint-spec
# Render 대시보드에서 "New +" -> "Blueprint"로 이 저장소를 연결하면 자동 반영됩니다.
services:
  - type: web
    name: issuelens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT "webapp:create_app()"
    healthCheckPath: /
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: WEBAPP_DB
        value: /opt/render/project/src/instance/app.db
      - key: PYTHON_VERSION
        value: "3.11.9"
      # 소셜 로그인을 쓰려면 Render 대시보드에서 아래 값을 직접 채워 넣으세요 (선택)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
